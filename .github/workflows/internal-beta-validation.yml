# Internal-beta crash-monitoring validation build.
#
# Builds a release APK with crash monitoring enabled, solely to validate that
# sanitized crash events reach the Sentry EU project. This file lives on the
# default branch because GitHub only registers `workflow_dispatch` for
# workflows present there — it is the bootstrap for validating PR #65, which
# remains unmerged.
#
# ── Why manual dispatch only ─────────────────────────────────────────────────
# No `pull_request`, no `pull_request_target`, no `push`. A workflow that
# exposes secrets on a pull-request trigger hands them to whatever code the PR
# contains; `pull_request_target` is worse, because it runs with write-scoped
# context against untrusted code. Manual dispatch means a human with write
# access chooses when this runs.
#
# ── Why the commit is pinned ─────────────────────────────────────────────────
# The job checks out a commit SHA that must equal the reviewed PR #65 head. It
# never accepts a branch name, so it cannot be pointed at unreviewed code — from
# a fork or otherwise — while holding the DSN.
#
# ── Why no artifact upload ───────────────────────────────────────────────────
# **This repository is public.** Workflow artifacts on a public repository are
# downloadable, and the APK necessarily embeds the Sentry DSN as its ingestion
# routing identifier — true of every Sentry client, including browser
# JavaScript, and not concealable. Publishing the artifact would publish the
# DSN. The build therefore stays on the runner.
name: Internal Beta Validation Build

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Reviewed source commit to build (must equal the approved PR #65 head)'
        required: true
      app_version:
        description: 'App version for the release identifier'
        required: true
        default: '0.2.0'
      app_build:
        description: 'Build number for the release identifier'
        required: true
        default: '208'
      validation_label:
        description: 'Optional human-readable label for this run (A-Z a-z 0-9 hyphen, max 32)'
        required: false
        default: ''

# Least privilege: read the repository, nothing else. No packages, no
# deployments, no id-token, no write scope of any kind.
permissions:
  contents: read

env:
  # The only commit this workflow is approved to build. Changing it is a
  # reviewed change to this file, not a dispatch-time decision.
  APPROVED_COMMIT: c550ffa9e0521c3fd8508374d9ef2f00c3bc21d1

jobs:
  validation-build:
    name: Internal-beta validation build
    runs-on: ubuntu-latest

    # Binds the job to the environment that owns the DSN, so environment
    # protection rules (required reviewers, branch policy) gate this run.
    environment: internal-beta

    steps:
      # Runs before checkout so unreviewed code cannot execute even once if the
      # requested commit is not the approved one.
      - name: Enforce the approved source commit
        env:
          REQUESTED: ${{ inputs.source_commit }}
        run: |
          if [ "${REQUESTED}" != "${APPROVED_COMMIT}" ]; then
            echo "::error::Refusing to build '${REQUESTED}'."
            echo "This workflow only builds the reviewed commit ${APPROVED_COMMIT}."
            exit 1
          fi
          echo "Source commit matches the approved PR #65 head."

      # The label is cosmetic. It is validated here and used ONLY in the job
      # summary: it never reaches an exception message, a tag, a context, the
      # release, the environment, or the checked-out commit.
      - name: Validate the optional label
        env:
          LABEL: ${{ inputs.validation_label }}
        run: |
          if [ -n "${LABEL}" ] && ! printf '%s' "${LABEL}" | grep -qE '^[A-Za-z0-9-]{1,32}$'; then
            echo "::error::validation_label must be 1-32 characters of A-Z a-z 0-9 or hyphen."
            exit 1
          fi
          echo "Label accepted."

      - name: Checkout the approved commit
        uses: actions/checkout@v4
        with:
          # A full SHA, never a branch or tag, so the built tree is exactly the
          # reviewed one and cannot be moved after approval.
          ref: ${{ env.APPROVED_COMMIT }}
          persist-credentials: false

      # Fails before Flutter is installed if the secret is missing, rather than
      # quietly producing a monitoring-disabled build that would look like a
      # successful validation and prove nothing.
      - name: Verify the DSN secret is available
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_INTERNAL_BETA }}
        run: |
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::error::SENTRY_DSN_INTERNAL_BETA is not available to this job."
            echo "Confirm the secret exists in the 'internal-beta' environment."
            exit 1
          fi
          # Length only. The value is never echoed, and GitHub masks it anyway.
          echo "DSN secret present (length ${#SENTRY_DSN})."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # The privacy gate runs before any build that could transmit. If a
      # prohibited marker can reach an envelope, no validation build exists.
      - name: Privacy gate — envelope and adversarial suites
        run: |
          flutter test test/crash/
          flutter test test/telemetry/privacy_adversarial_test.dart

      - name: Full test suite
        run: flutter test

      # ── Runner-local Sentry receipt validation ──────────────────────────
      #
      # Sends exactly three fixed, non-clinical events through the REAL crash
      # path from the pinned commit: CrashReporter -> SentryCrashSink ->
      # SentryEventSanitiser (as `beforeSend`) -> the SDK transport. No
      # handcrafted HTTP request is made to Sentry, and the privacy boundary is
      # not bypassed at any point.
      #
      # The harness is written here rather than committed because the classes
      # it drives exist only in the pinned PR #65 tree, not on `main` — a
      # committed file referencing them would break `main`. It lives for the
      # duration of the run and is never uploaded.
      #
      # The DSN is read from the process environment, so its value never enters
      # a command line, a --dart-define, or the test source.
      #
      # ── Why the receipt runner lifts the test HTTP override ──────────────
      #
      # Run 31788391301 failed here with an all-zero SentryId. The cause was
      # neither Sentry nor privacy: `TestWidgetsFlutterBinding` installs
      # `HttpOverrides.global = _MockHttpOverrides()`
      # (flutter_test/src/_binding_io.dart), whose client answers every request
      # with 400 and opens no socket. Sentry's `HttpTransport` maps any status
      # >= 400 to `SentryId.empty()` (sentry/src/transport/http_transport.dart),
      # which is precisely the observed symptom. On a Linux runner the transport
      # IS `HttpTransport`: `createBinding` returns the C binding `SentryNative`,
      # whose `supportsCaptureEnvelope` is false, so no `FileSystemTransport` is
      # installed and the SDK falls through to HTTP.
      #
      # So the receipt runner lifts that override for its own process only, and
      # restores it in a `finally`. This is the mechanism flutter_test itself
      # documents as supported: "If another [HttpClient] is provided using
      # [HttpOverrides.runZoned], that will take precedence over this provider."
      #
      # The scope is deliberately narrow. `flutter test` runs each file in its
      # own process, and this override is applied inside one generated file that
      # is deleted after the step, so no committed test and no other file is
      # affected. `Full test suite` above runs first and keeps full isolation.
      # The isolation guard below asserts that fact rather than assuming it.
      - name: Write the network-isolation regression guard
        run: |
          mkdir -p test/ci_validation
          cat > test/ci_validation/network_isolation_guard_test.dart <<'DART'
          /// Secret-free regression guard for the failure mode behind run
          /// 31788391301. Proves BOTH states against a loopback ingest server,
          /// so the mechanism is demonstrated before the real DSN is ever used:
          ///
          ///   * mock active  — no real socket, no envelope, SentryId.empty
          ///   * override lifted — real socket, exactly three envelopes, three
          ///     non-zero ids — and isolation restored afterwards
          ///
          /// Uses a loopback DSN. No secret, no real Sentry project, no network
          /// egress. Runs before the receipt harness.
          // ignore_for_file: invalid_use_of_internal_member
          @Timeout(Duration(minutes: 4))
          library;

          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';
          import 'package:sentry_flutter/sentry_flutter.dart';
          import 'package:wellapath_mobile/core/crash/crash_reporter.dart';
          import 'package:wellapath_mobile/core/crash/crash_validation.dart';
          import 'package:wellapath_mobile/core/crash/sentry_crash_sink.dart';

          /// Drives the three validation sends at a loopback ingest endpoint.
          ///
          /// `Sentry.init`'s `options:` parameter is `@internal`. It is used
          /// here, and only here, to pin the pure-Dart `HttpTransport` path on
          /// any host rather than the platform-dependent transport that
          /// `SentryFlutter.init` selects — which is what makes this guard
          /// verifiable off-runner. The receipt harness does NOT do this: it
          /// uses the ordinary `SentryFlutter.init` path and asserts Linux.
          Future<(List<SentryId>, int, int)> drive({required bool lift}) async {
            var envelopes = 0;
            final server =
                await HttpServer.bind(InternetAddress.loopbackIPv4, 0);
            server.listen((HttpRequest request) async {
              await request.drain<void>();
              if (request.uri.path.contains('envelope')) envelopes++;
              request.response
                ..statusCode = 200
                ..headers.contentType = ContentType.json
                ..write('{"id":"0123456789abcdef0123456789abcdef"}');
              await request.response.close();
            });
            final dsn = 'http://publickey@127.0.0.1:${server.port}/1';

            final installed = HttpOverrides.current;
            if (lift) HttpOverrides.global = null;

            var sanitized = 0;
            final ids = <SentryId>[];
            try {
              await Sentry.close();
              final options = SentryFlutterOptions()..dsn = dsn;
              await Sentry.init((o) {
                CrashMonitoring.applyPrivacyOptions(o as SentryFlutterOptions);
                o.dsn = dsn;
                o.dist = 'isolation-guard';
                final privacyBoundary = o.beforeSend!;
                o.beforeSend = (event, hint) {
                  final result = privacyBoundary(event, hint);
                  if (result != null) sanitized++;
                  return result;
                };
              }, options: options);
              CrashReporter.setSink(SentryCrashSink());

              for (final marker in const [
                'WELLAPATH_I1_FLUTTER_FATAL',
                'WELLAPATH_I1_ASYNC_FATAL',
                'WELLAPATH_I1_NON_FATAL',
              ]) {
                CrashReporter.resetDedupe();
                ids.add(await Sentry.captureException(
                  CrashValidationError(marker),
                  stackTrace: StackTrace.current,
                ));
              }
              await Sentry.close().timeout(const Duration(seconds: 60));
            } finally {
              HttpOverrides.global = installed;
            }
            await server.close(force: true);
            return (ids, sanitized, envelopes);
          }

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            test('ordinary Flutter tests cannot open a real socket', () async {
              // A loopback server is the ground truth: if the fake override is
              // active the request never arrives, so the counter stays at zero.
              var hits = 0;
              final server =
                  await HttpServer.bind(InternetAddress.loopbackIPv4, 0);
              server.listen((HttpRequest request) async {
                hits++;
                request.response.statusCode = 204;
                await request.response.close();
              });

              expect(HttpOverrides.current, isNotNull,
                  reason: 'WP_DIAG=isolation_absent');

              final client = HttpClient();
              final request = await client
                  .getUrl(Uri.parse('http://127.0.0.1:${server.port}/probe'));
              final response = await request.close();
              await response.drain<void>();
              client.close();

              expect(response.statusCode, 400,
                  reason: 'WP_DIAG=isolation_bypassed');
              expect(hits, 0, reason: 'WP_DIAG=real_socket_opened');

              await server.close(force: true);
            });

            test('mock active — no socket, no envelope, zero ids', () async {
              final (ids, sanitized, envelopes) = await drive(lift: false);
              // Ordered so a privacy drop can never be misread as a transport
              // drop: the sanitizer passed all three, transport dropped them.
              expect(sanitized, 3,
                  reason: 'WP_DIAG=sanitizer_dropped_an_event');
              for (final id in ids) {
                expect(id, equals(SentryId.empty()),
                    reason: 'WP_DIAG=mock_did_not_block_transport');
              }
              expect(envelopes, 0,
                  reason: 'WP_DIAG=envelope_reached_ingest_under_mock');
            });

            test('override lifted — real socket, three envelopes, three ids',
                () async {
              final before = HttpOverrides.current;
              final (ids, sanitized, envelopes) = await drive(lift: true);
              expect(sanitized, 3,
                  reason: 'WP_DIAG=sanitizer_dropped_an_event');
              expect(ids, hasLength(3), reason: 'WP_DIAG=send_count_wrong');
              for (final id in ids) {
                expect(id, isNot(equals(SentryId.empty())),
                    reason: 'WP_DIAG=lifted_override_did_not_transmit');
              }
              expect(envelopes, 3,
                  reason: 'WP_DIAG=envelope_count_wrong');
              expect(identical(HttpOverrides.current, before), isTrue,
                  reason: 'WP_DIAG=isolation_not_restored');
            });
          }
          DART
          echo "Isolation guard written."

      - name: Verify ordinary tests remain network-isolated
        run: flutter test test/ci_validation/network_isolation_guard_test.dart

      - name: Write the receipt-validation harness
        run: |
          mkdir -p test/ci_validation
          cat > test/ci_validation/sentry_receipt_validation_test.dart <<'DART'
          /// Runner-local Sentry receipt validation. Generated by CI; not committed.
          ///
          /// Drives the real crash boundary so the three validation events are
          /// produced by the same code path a device would use.
          @Timeout(Duration(minutes: 5))
          library;

          import 'dart:async';
          import 'dart:io';

          import 'package:flutter/foundation.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:sentry_flutter/sentry_flutter.dart';
          import 'package:wellapath_mobile/core/crash/crash_config.dart';
          import 'package:wellapath_mobile/core/crash/crash_reporter.dart';
          import 'package:wellapath_mobile/core/crash/crash_validation.dart';
          import 'package:wellapath_mobile/core/crash/sentry_crash_sink.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            test('exactly three sanitized events are accepted by Sentry', () async {
              final dsn = Platform.environment['SENTRY_DSN'] ?? '';
              final release = Platform.environment['WP_RELEASE'] ?? '';
              final dist = Platform.environment['WP_VALIDATION_RUN_ID'] ?? '';

              // ── Gate 1: configuration ────────────────────────────────────
              // Fail closed: no DSN, no transmission, no false "validated".
              expect(CrashConfig.isValidDsn(dsn), isTrue,
                  reason: 'WP_DIAG=dsn_missing_or_structurally_invalid');
              expect(release, isNotEmpty, reason: 'WP_DIAG=release_missing');
              expect(dist, isNotEmpty, reason: 'WP_DIAG=run_id_missing');

              final config = CrashConfig(
                enabled: true,
                dsn: dsn,
                environment: 'internal-beta',
                release: release,
              );
              await CrashMonitoring.init(config: config);
              expect(CrashMonitoring.config.enabled, isTrue,
                  reason: 'WP_DIAG=crash_monitoring_disabled');

              // ── Gate 2: network capability ───────────────────────────────
              // The binding installs a fake HttpClient that answers 400 and
              // opens no socket; Sentry maps >= 400 to an all-zero SentryId.
              // Lift it for THIS PROCESS ONLY and restore it in `finally`.
              // A receipt is only meaningful where the SDK actually speaks
              // HTTP. On macOS/iOS/Android the envelope is handed to the
              // native SDK via FileSystemTransport, which returns a non-zero
              // id without any network call — verified locally to "accept"
              // three events against an unroutable DSN. Linux has no such
              // path (`SentryNative.supportsCaptureEnvelope` is false), so the
              // SDK falls through to HttpTransport and a non-zero id means
              // Sentry really answered 2xx. Pin that, so changing `runs-on`
              // cannot silently turn this gate into a false pass.
              expect(Platform.isLinux, isTrue,
                  reason: 'WP_DIAG=unsupported_receipt_platform');

              final installed = HttpOverrides.current;
              expect(installed, isNotNull,
                  reason: 'WP_DIAG=unexpected_binding_state');
              HttpOverrides.global = null;
              expect(HttpOverrides.current, isNull,
                  reason: 'WP_DIAG=network_interception_still_active');

              // Re-init the SDK with the production privacy options, plus a
              // counting wrapper around the real sanitizer so the number of
              // events that survive it can be asserted. The sanitizer itself is
              // unchanged and still decides what leaves.
              var sanitized = 0;
              final ids = <SentryId>[];
              var stage = 'init';

              try {
                await Sentry.close();
                await SentryFlutter.init((options) {
                  CrashMonitoring.applyPrivacyOptions(options);
                  options.dist = dist;
                  final privacyBoundary = options.beforeSend!;
                  options.beforeSend = (event, hint) {
                    final result = privacyBoundary(event, hint);
                    if (result != null) sanitized++;
                    return result;
                  };
                });
                CrashReporter.setSink(SentryCrashSink());

                // Three classifications, three fixed non-clinical markers.
                stage = 'send';
                Future<void> send(
                    String marker, String origin, bool fatal) async {
                  CrashReporter.resetDedupe();
                  final error = CrashValidationError(marker);
                  final id = await Sentry.captureException(
                    error,
                    stackTrace: StackTrace.current,
                    withScope: (scope) {
                      scope.setTag('crash_source', origin);
                      scope.setTag('severity', fatal ? 'fatal' : 'non_fatal');
                    },
                  );
                  ids.add(id);
                }

                await send(
                    'WELLAPATH_I1_FLUTTER_FATAL', 'flutter_framework', true);
                await send(
                    'WELLAPATH_I1_ASYNC_FATAL', 'platform_dispatch', true);
                await send('WELLAPATH_I1_NON_FATAL', 'handled', false);

                // Bounded flush. close() drains pending envelopes; if it cannot
                // complete the job fails rather than report a false success.
                stage = 'flush';
                await Sentry.close().timeout(const Duration(seconds: 60));
                stage = 'complete';
              } on TimeoutException {
                stage = 'flush_timeout';
                rethrow;
              } on HandshakeException {
                stage = 'tls_failure';
                rethrow;
              } on SocketException catch (error) {
                // Classify by shape only. The exception text carries the
                // ingest host, so it is never printed or re-raised as a
                // message — only the category below is emitted.
                stage = error.message.contains('Failed host lookup')
                    ? 'dns_failure'
                    : 'network_unreachable';
                rethrow;
              } finally {
                // Restore isolation for this process no matter the outcome.
                HttpOverrides.global = installed;

                // Safe diagnostics: fixed categories and counts only. No DSN,
                // no envelope, no event JSON, no headers, no exception text.
                final accepted =
                    ids.where((id) => id != SentryId.empty()).length;
                debugPrint('WP_DIAG stage=$stage sanitized=$sanitized '
                    'sends=${ids.length} accepted=$accepted '
                    'network_lifted=true');
              }

              expect(identical(HttpOverrides.current, installed), isTrue,
                  reason: 'WP_DIAG=isolation_not_restored');

              // Ordered so the failure mode is unambiguous: a sanitizer drop is
              // reported as a sanitizer drop, never as a transport failure.
              expect(sanitized, 3,
                  reason: 'WP_DIAG=sanitizer_dropped_an_event');
              expect(ids, hasLength(3), reason: 'WP_DIAG=send_count_wrong');
              for (final id in ids) {
                expect(id, isNot(equals(SentryId.empty())),
                    reason: 'WP_DIAG=sentry_did_not_accept_event');
              }
            });
          }
          DART
          echo "Harness written."

      - name: Send the three validation events
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_INTERNAL_BETA }}
          WP_RELEASE: wellapath-mobile@${{ inputs.app_version }}+${{ inputs.app_build }}
          # Derived only from a fixed prefix, the approved commit and the run
          # identity. No user, install, device, assessment or telemetry id, and
          # no timestamp.
          WP_VALIDATION_RUN_ID: i1val-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          flutter test test/ci_validation/sentry_receipt_validation_test.dart

      - name: Remove the harness from the runner tree
        if: always()
        run: rm -rf test/ci_validation

      # The DSN reaches the compiler only through this define. It is passed via
      # an environment variable so the value never appears in a rendered command
      # line, and `set -x` is never enabled.
      #
      # CRASH_REPORTING_PRODUCTION_APPROVED is deliberately NOT set: the third
      # production gate stays closed, so this build could not collect from
      # production even if APP_ENV were changed.
      - name: Build internal-beta validation APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_INTERNAL_BETA }}
          APP_VERSION: ${{ inputs.app_version }}
          APP_BUILD: ${{ inputs.app_build }}
        run: |
          flutter build apk --release \
            --dart-define=CRASH_REPORTING_ENABLED=true \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=CRASH_VALIDATION_ENABLED=true \
            --dart-define=APP_ENV=internal-beta \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=APP_BUILD="$APP_BUILD"

      # The APK necessarily contains the DSN — that is Sentry's public
      # ingestion routing identifier and no client can hide it — so the APK is
      # excluded from this scan and never leaves the runner. What this checks is
      # that the key has not leaked into a tracked file.
      - name: Verify the DSN has not leaked into tracked files
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_INTERNAL_BETA }}
        run: |
          key="${SENTRY_DSN#*//}"; key="${key%%@*}"
          if [ -z "$key" ]; then
            echo "::error::Could not parse the DSN public key for the leak check."
            exit 1
          fi
          if git grep -qI --no-color -- "$key" -- . 2>/dev/null; then
            echo "::error::The DSN public key appears in a tracked file."
            exit 1
          fi
          echo "DSN public key is absent from all tracked files."

      # Deliberately no `actions/upload-artifact` step anywhere in this file.
      - name: Build summary
        run: |
          {
            echo "### Internal-beta validation build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source commit | \`${APPROVED_COMMIT}\` |"
            echo "| Release | \`wellapath-mobile@${{ inputs.app_version }}+${{ inputs.app_build }}\` |"
            echo "| Environment | \`internal-beta\` |"
            echo "| Crash reporting | enabled |"
            echo "| Production gate | closed |"
            echo "| Native crash handling | disabled |"
            echo "| Session tracking | disabled |"
            echo "| APK uploaded | no — public repository |"
            echo "| Label | \`${{ inputs.validation_label }}\` |"
            echo ""
            echo "#### Validation events sent"
            echo ""
            echo "| Classification | crash_source | severity |"
            echo "| --- | --- | --- |"
            echo "| Flutter fatal | \`flutter_framework\` | \`fatal\` |"
            echo "| Asynchronous fatal | \`platform_dispatch\` | \`fatal\` |"
            echo "| Non-fatal | \`handled\` | \`non_fatal\` |"
            echo ""
            echo "Local privacy gate: **passed** (required before transmission)."
            echo "Send and bounded flush: **succeeded** (job would have failed otherwise)."
            echo ""
            echo "#### Finding these in Sentry"
            echo ""
            echo "The fixed markers are **deliberately redacted by the sanitizer**"
            echo "(SCREAMING_CASE and snake_case identifiers are scrubbed), so do"
            echo "not search for them. Search instead by:"
            echo ""
            echo "- issue type \`CrashValidationError\`"
            echo "- \`environment:internal-beta\`"
            echo "- \`release:wellapath-mobile@${{ inputs.app_version }}+${{ inputs.app_build }}\`"
            echo "- \`dist:i1val-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
            echo "- tag \`crash_source\` to tell the three apart"
          } >> "$GITHUB_STEP_SUMMARY"
