name: Mobile CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-build:
    name: Flutter Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Flutter project
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "flutter_exists=true" >> $GITHUB_OUTPUT
          else
            echo "flutter_exists=false" >> $GITHUB_OUTPUT
            echo "No Flutter project found yet — skipping checks until Phase E1"
          fi

      - name: Setup Flutter
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: flutter pub get

      - name: Run Flutter analyze
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: flutter analyze

      - name: Check Dart formatting
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: dart format --output=none --set-exit-if-changed .

      # The `plutil` tag marks export-options verification tests that delegate
      # their verdict to Apple's /usr/bin/plutil, which does not exist here.
      # They are EXCLUDED on Linux because the dependency is absent, and run in
      # the mandatory macos-export-options-guard job below. They are not skipped
      # to keep this job green, and there is no string-scanner fallback to make
      # them portable — two such scanners were already defeated by review.
      - name: Run the full test suite (excluding macOS-only plutil tests)
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: flutter test --exclude-tags plutil

      # CI holds no signing material, and release signing now fails closed, so
      # a plain `flutter build apk --release` here would (correctly) fail. The
      # unsigned path is requested explicitly rather than letting the build
      # quietly pick a fallback key: the artifact carries no signature at all,
      # which is what the distributability check below relies on.
      - name: Build unsigned release APK (not distributable)
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        env:
          WELLAPATH_ALLOW_UNSIGNED_RELEASE: 'true'
        run: flutter build apk --release

      # Fails the job if CI ever produces something that looks signed. A
      # signature here would mean either signing material reached the runner or
      # the debug fallback came back — both are release-integrity failures, and
      # both previously produced an artifact labelled "release".
      - name: Verify the CI artifact is genuinely unsigned
        if: steps.check_flutter.outputs.flutter_exists == 'true'
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found; cannot prove the artifact is unsigned."
            exit 1
          fi
          if "$apksigner" verify "$apk" 2>/dev/null; then
            echo "::error::CI produced a SIGNED release APK. CI must never hold \
          signing material, and release builds must not fall back to debug keys."
            exit 1
          fi
          echo "CI artifact is unsigned and therefore not distributable, as required."
          sha256sum "$apk"

  macos-export-options-guard:
    name: iOS Export Options Guard (macOS)
    runs-on: macos-latest

    # Mandatory, not optional. The iOS symbol-upload guard delegates its verdict
    # to Apple's /usr/bin/plutil, so these cases can only be judged on macOS.
    # Build 216 reached App Store Connect with uploadSymbols false; this job is
    # what makes that detectable in CI rather than only at release time.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm Apple's plutil is present
        run: |
          test -x /usr/bin/plutil || {
            echo "::error::/usr/bin/plutil is missing — the export-options guard cannot be verified"
            exit 1
          }
          /usr/bin/plutil -lint /System/Library/CoreServices/SystemVersion.plist

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run the export-options guard tests (plutil-backed)
        run: flutter test --tags plutil

      - name: Prove the guard rejects a symbols-disabled plist end to end
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          dart run scripts/export_options_tool.dart generate \
            --mode=app-store --destination=upload --team-id=TESTTEAM00 \
            --out="$work/good.plist"
          dart run scripts/export_options_tool.dart verify "$work/good.plist"
          echo "compliant plist accepted (exit 0) — as expected"

          # Flip ONLY uploadSymbols, using Apple's own tool so nothing else in
          # the file changes (a sed on <true/> would also flip stripSwiftSymbols).
          cp "$work/good.plist" "$work/bad.plist"
          /usr/bin/plutil -replace uploadSymbols -bool false "$work/bad.plist"

          # plutil must agree this now resolves to false before we assert
          # anything about the guard. NOTE: `-extract <key> json` is wrong here —
          # plutil refuses a bare scalar with "Invalid object in plist for JSON
          # format", which under `set -euo pipefail` aborts this step before the
          # assertion below ever runs. Use `raw`.
          test "$(/usr/bin/plutil -extract uploadSymbols raw -o - "$work/bad.plist")" = "false"

          # Assert the exact exit code, not merely "non-zero": a bad plist
          # mis-classified as unusable (2) must not satisfy this proof.
          set +e
          dart run scripts/export_options_tool.dart verify "$work/bad.plist"
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::expected exit 1 (policy violation) for a symbols-disabled plist, got $rc"
            exit 1
          fi
          echo "symbols-disabled plist rejected with exit 1 — guard is live"

